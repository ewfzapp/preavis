<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée - Preavis</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 50px; background: #121212; color: #e0e0e0; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px; border-radius: 12px; background: #1e1e1e; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { font-size: 64px; margin: 0; color: #007bff; }
        p { font-size: 20px; margin: 20px 0; }
        .btn { display: inline-block; padding: 12px 24px; background: #007bff; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Cette page n'existe plus ou a été déplacée.</p>
        <a href="/" class="btn">Retour à l'accueil</a>
    </div>
</body>
</html>
